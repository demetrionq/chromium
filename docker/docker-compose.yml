version: '3.7'

services:
  chromium_builder:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    volumes:
      - ../../../chromium:/chromium
    environment:
      TARGET_CPU: $TARGET_CPU
    command: >
        bash -c "
        cd /chromium &&
        python src/build_scripts/tools/download_dependencies.py &&
        cd /chromium/src/ &&
        git reset --hard &&
        gn gen out/android_$$TARGET_CPU &&
        cd /chromium/src/ &&
        autoninja -C out/android_$$TARGET_CPU chrome_public_apk"
